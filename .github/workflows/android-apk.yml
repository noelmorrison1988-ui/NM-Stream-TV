name: Build NM Stream TV APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.1" "build-tools;36.0.0" "platform-tools"

      - name: Restore Kodi Core runtime
        id: kodi-cache
        uses: actions/cache@v4
        with:
          path: app/libs/kodi-runtime.aar
          key: kodi-core-21.3-omega-arm64-v1

      - name: Build integrated Kodi Core
        if: steps.kodi-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        env:
          KODI_BRANCH: Omega
          KODI_JOBS: '2'
        run: bash .github/scripts/build-kodi-aar.sh

      - name: Verify integrated Kodi Core
        if: github.event_name != 'pull_request'
        run: |
          test -s app/libs/kodi-runtime.aar
          ls -lh app/libs/kodi-runtime.aar

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Rename APK
        id: apk
        shell: bash
        run: |
          VERSION_NAME=$(grep -m1 'versionName' app/build.gradle.kts | cut -d'"' -f2)
          APK_NAME="NM-Stream-TV-v${VERSION_NAME}-debug"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${APK_NAME}.apk"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: dist/${{ steps.apk.outputs.apk_name }}.apk
          if-no-files-found: error
