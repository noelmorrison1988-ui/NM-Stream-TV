name: Build NM Stream TV APK

on:
  workflow_dispatch:
  push:
    branches: [ main, lite, tv-box-lite ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.1" "build-tools;36.0.0" "platform-tools"

      - name: Verify TMDB build credential
        shell: bash
        run: |
          if [ -z "$TMDB_READ_ACCESS_TOKEN" ]; then
            echo "TMDB_READ_ACCESS_TOKEN repository secret is missing."
            exit 1
          fi

      - name: Inject TMDB credential
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          token = os.environ["TMDB_READ_ACCESS_TOKEN"]
          target = Path("app/src/main/java/za/co/nm/streamtv/TmdbBuildSecret.kt")
          target.write_text(
              "package za.co.nm.streamtv\n\n"
              "internal object TmdbBuildSecret {\n"
              "    const val TOKEN = " + json.dumps(token) + "\n"
              "}\n",
              encoding="utf-8",
          )
          PY

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Rename APK
        id: apk
        shell: bash
        run: |
          VERSION_NAME=$(grep -m1 'versionName' app/build.gradle.kts | cut -d'"' -f2)
          APK_NAME="NM-Stream-TV-TV-Box-Lite-v${VERSION_NAME}-debug"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${APK_NAME}.apk"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: dist/${{ steps.apk.outputs.apk_name }}.apk
          if-no-files-found: error
